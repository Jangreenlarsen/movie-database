# Feature #152 — unattended Debian 13 (trixie) installation til den
# genanvendelige VM-skabelon. Genererer et minimalt server-basissystem;
# selve stakken (MongoDB/Node/Caddy/ufw) lægges ovenpå af packer/provision.sh
# efter første boot, jf. DEPLOYMENT.md's installations-log trin 1-6+11.
#
# Jans valg (2026-08-14): almindeligt bruger/adgangskode-login (ikke
# SSH-nøgle-only) — konsol-login i VMM skal virke uden en nøglefil.
# Adgangskoden herunder ("jgl_password" i variables.pkr.hcl) er en bevidst
# simpel bootstrap-værdi: provision.sh tvinger den til at blive skiftet ved
# første login (chage -d 0), så den aldrig reelt er brugbar bagefter.
# Ændres jgl_password i variables.pkr.hcl, SKAL linjerne herunder opdateres
# tilsvarende (preseed kan ikke selv læse Packer-variabler).

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Europe/Copenhagen
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string moviedb-appliance
d-i netcfg/get_domain string unassigned-domain
d-i netcfg/wireless_wep string

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/make-user boolean true
d-i passwd/user-fullname string jgl
d-i passwd/username string jgl
d-i passwd/user-password password ChangeMe123!
d-i passwd/user-password-again password ChangeMe123!
d-i passwd/root-login boolean false
d-i user-setup/allow-password-weak boolean true

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server sudo curl gnupg ca-certificates
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

# Kontoopsætning (sudo, tvunget adgangskode-skift, sshd, velkomst-script) sker
# nu i provision.sh i stedet for her — nemmere at læse/teste samlet ét sted
# end spredt i en semikolon-kæde i late_command.
